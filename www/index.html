<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const D=[[1,0],[-1,0],[0,1],[0,-1]];

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

(x,y)=>E(x,y,-.1,0,.7,.42)||(x>.5&&x<1&&Math.abs(y)<(x-.45)*.9)||E(x,y,0,-.45,.2,.15)||E(x,y,.1,.45,.15,.12),
(x,y)=>E(x,y,.1,.1,.55,.25)||E(x,y,-.6,-.2,.25,.22)||E(x,y,-.85,-.1,.15,.1)||E(x,y,-.5,-.45,.08,.15)||R(x,y,-.45,.1,-.3,.7)||R(x,y,.3,.1,.45,.7)||E(x,y,.75,-.1,.1,.2),
(x,y)=>E(x,y,0,.1,.8,.28)||(y<.1&&y>-.55&&Math.abs(x+.05)<(y+.55)*.45)||(x>.65&&x<1&&Math.abs(y-.1)<(x-.6)*.8)||E(x,y,.1,.4,.2,.12),
(x,y)=>{x*=1.2;y=-y*1.2-.1;return(x*x+y*y-1)**3-x*x*y**3<0},
(x,y)=>{const a=Math.atan2(y,x);return Math.hypot(x,y)<.3+.65*Math.abs(Math.cos(2.5*(a+1.5708)))**1.5}
];
function blob(r){const k=3+(r()*4|0),p=[[0,0,.2+r()*.3,.3+r()*.4]];for(let i=0;i<k;i++)p.push([r()*.6,r()*1.2-.6,.15+r()*.3,.15+r()*.3]);return(x,y)=>{x=Math.abs(x);return p.some(q=>E(x,y,...q))}}
const mk=p=>({p,o:0,st:0,s:0,v:0,sh:0,fl:0,hi:0,d:null,dl:0,len:0,e:0});
function gen(n){
 const rd=rng(n*7919+13);boss=n%12==0;
 G=Math.min(Math.min(9+Math.floor(n*.6),34)+(boss?4:0),40);
 let f=rd()<.55||n<=5?S[(n<=5?n-1:rd()*S.length|0)%S.length]:blob(rd);
 if(boss){const a=f,b=blob(rd);f=(x,y)=>a(x,y)||b(x,y)}
 const rot=rd()<.5,fl=rd()<.5,cl=[];
 for(let y=0;y<G;y++)for(let c=0;c<G;c++){let u=(c+.5)/G*2-1,v=(y+.5)/G*2-1;if(fl)u=-u;if(rot)[u,v]=[v,u];if(f(u,v))cl.push([c,y])}
 if(cl.length<20){cl.length=0;for(let y=0;y<G;y++)for(let c=0;c<G;c++)cl.push([c,y])}
 const sh=a=>{for(let i=a.length-1;i>0;i--){const j=rd()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
 const M=[...Array(G)].map(()=>Array(G).fill(0));cl.forEach(([c,y])=>M[y][c]=1);
 const A=[...Array(G)].map(()=>Array(G).fill(null));sn=[];
 const ml=Math.min(3+Math.floor(n*.5),36);
 for(const [c,y] of sh(cl.slice())){if(A[y][c])continue;const s=mk([[c,y]]);A[y][c]=s;sn.push(s);const L=2+(rd()*ml|0);let pd=-1;
  while(s.p.length<L){const[x,z]=s.p[s.p.length-1];let o=[];D.forEach((d,i)=>{const a=x+d[0],b=z+d[1];if(a>=0&&b>=0&&a<G&&b<G&&M[b][a]&&!A[b][a])o.push(i)});if(!o.length)break;
   const t=o.filter(i=>i!=pd),i=(t.length&&rd()<.65?t:o)[rd()*(t.length&&rd()<.65?t.length:o.length)|0]??o[0];pd=i;const a=x+D[i][0],b=z+D[i][1];s.p.push([a,b]);A[b][a]=s}}
 const opts=s=>{const k=s.p.length;if(k==1)return D.map(d=>({rev:0,d}));const a=s.p[k-1],b=s.p[k-2],c=s.p[0],e=s.p[1];return[{rev:0,d:[a[0]-b[0],a[1]-b[1]]},{rev:1,d:[c[0]-e[0],c[1]-e[1]]}]};
 const ok=(s,o)=>{const h=o.rev?s.p[0]:s.p[s.p.length-1];let x=h[0]+o.d[0],y=h[1]+o.d[1];while(x>=0&&y>=0&&x<G&&y<G){const q=A[y][x];if(q&&!q.o)return 0;x+=o.d[0];y+=o.d[1]}return 1};
 let Ls=sh(sn.slice());
 while(Ls.length){let i=0,os;for(;i<Ls.length;i++){os=opts(Ls[i]).filter(o=>ok(Ls[i],o));if(os.length)break}
  if(i==Ls.length){let t=Ls[0];const mn=s=>Math.min(...s.p.map(a=>a[1]));for(const s of Ls)if(mn(s)<mn(t))t=s;
   Ls.splice(Ls.indexOf(t),1);sn.splice(sn.indexOf(t),1);for(const[c,y]of t.p){const q=mk([[c,y]]);A[y][c]=q;sn.push(q);Ls.push(q)}continue}
  const s=Ls.splice(i,1)[0],o=os[rd()*os.length|0];if(o.rev)s.p.reverse();s.d=o.d;s.o=1}

}
function start(){ps=0;z=1;px=py=0;gen(lvl);lives=3;left=total=sn.length;T=0;state='play';$('msg').style.display='none';layout();hud()}
function hud(){const d=lvl<6?'EASY':lvl<15?'NORMAL':lvl<30?'HARD':'SUPER HARD';$('tag').textContent=boss?'☠ BOSS':d;$('tag').style.background=boss?'#a8161e':'#e0503a';$('lv').textContent='LVL '+lvl;
 $('st').innerHTML='<span style="color:#f2b705">'+'★'.repeat(lives)+'</span><span style="color:#b3b9a5">'+'★'.repeat(3-lives)+'</span>';$('bf').style.width=(1-left/total)*100+'%'}
function layout(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;const a=Math.min(W-16,H-250);cs=a/G;ox=(W-a)/2;oy=Math.max(110,(H-a)/2)}
addEventListener('resize',layout);
const head=s=>s.p[s.p.length-1];
const blocker=s=>{const h=head(s);let x=h[0]+s.d[0],y=h[1]+s.d[1];while(x>=0&&y>=0&&x<G&&y<G){if(occ[y][x])return occ[y][x];x+=s.d[0];y+=s.d[1]}return null};
const P=new Map();let mv=0;
function tap(sx,sy){ac();if(state!='play')return;const wx=(sx-px)/z,wy=(sy-py)/z,cx=Math.floor((wx-ox)/cs),cy=Math.floor((wy-oy)/cs);let best=null,bd=cs*1.3;
 for(let y=cy-1;y<=cy+1;y++)for(let x=cx-1;x<=cx+1;x++){const q=occ[y]?.[x];if(!q)continue;const d=Math.hypot(ox+(x+.5)*cs-wx,oy+(y+.5)*cs-wy);if(d<bd){bd=d;best=q}}
 if(!best)return;const b=blocker(best);
 if(!b){tone();best.p.forEach(([c,y])=>occ[y][c]=null);best.st=1;best.v=cs*6;const h=head(best),qx=ox+(h[0]+.5)*cs,qy=oy+(h[1]+.5)*cs;best.e=best.d[0]>0?W-qx:best.d[0]<0?qx:best.d[1]>0?H-qy:qy;best.e+=cs}
 else{bonk();best.sh=1;b.fl=1;lives--;hud();if(!lives){state='lost';setTimeout(()=>$('msg').style.display='flex',500)}}}
function zoomAt(x,y,f){const nz=Math.min(5,Math.max(1,z*f)),k=nz/z;px=x-(x-px)*k;py=y-(y-py)*k;z=nz}
function clamp(){px=Math.min(60,Math.max(W-W*z-60,px));py=Math.min(60,Math.max(H-H*z-60,py));if(z==1){px=0;py=0}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});mv=P.size==1?0:99});
cv.addEventListener('pointermove',e=>{const q=P.get(e.pointerId);if(!q)return;const nx=e.clientX,ny=e.clientY;
 if(P.size==2){const o=[...P.entries()].find(([k])=>k!=e.pointerId)[1],d0=Math.hypot(q.x-o.x,q.y-o.y),d1=Math.hypot(nx-o.x,ny-o.y),mx=(nx+o.x)/2,my=(ny+o.y)/2,pmx=(q.x+o.x)/2,pmy=(q.y+o.y)/2;if(d0>0)zoomAt(mx,my,d1/d0);px+=mx-pmx;py+=my-pmy}
 else{mv+=Math.hypot(nx-q.x,ny-q.y);if(mv>8){px+=nx-q.x;py+=ny-q.y}}

let AC,cfg=JSON.parse(localStorage.getItem('ae_cfg')||'{"snd":1,"mode":"up"}'),ni=0,lt=0,lr=-1;
cfg.ins=cfg.ins||0;const SC=[0,2,4,7,9,12,14,16,19,21,24].map(n=>261.63*2**(n/12));
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function ping(f,v=.3,dur=1,type='triangle'){if(!AC||!cfg.snd)return;const t=AC.currentTime,g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);g.connect(AC.destination);[[f,1],[f*2,.3],[f*3,.1]].forEach(([q,a])=>{const o=AC.createOscillator();o.type=type;o.frequency.value=q;const h=AC.createGain();h.gain.value=a;o.connect(h);h.connect(g);o.start(t);o.stop(t+dur)})}
function tone(){if(cfg.pat&&playPat())return;const n=performance.now();if(cfg.mode=='up'){ni=n-lt<700?(ni+1)%SC.length:0}else{let i;do{i=Math.random()*SC.length|0}while(i==lr);lr=i;ni=i}lt=n;inst(ni)}
const INS=[['Piano 🎹',{t:'triangle',a:.008,d:1,h:[[2,.3],[3,.1]]}],['Guitar 🎸',{t:'sawtooth',a:.004,d:.9,lp:3500,lpe:500,v:.2}],['Violin 🎻',{t:'sawtooth',a:.1,d:.8,lp:2600,vib:6,v:.16}],['Harmonica 🎶',{t:'square',a:.03,d:.5,lp:2000,v:.12,det:8}],['Flute 🪈',{t:'sine',a:.07,d:.6,vib:5,h:[[2,.12]],v:.35}],['Xylophone',{t:'sine',a:.003,d:.4,h:[[3,.35],[6,.1]],oct:2}],['Music box',{t:'sine',a:.003,d:1.3,h:[[2.76,.2]],oct:2}],['Bass',{t:'triangle',a:.01,d:.6,h:[[2,.4]],oct:.25,v:.5}],['Synth',{t:'square',a:.005,d:.35,lp:2500,v:.12}],['Drums 🥁',null]];
function voice(f,c){const t=AC.currentTime,f0=f*(c.oct||1),g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(c.v||.3,t+c.a);g.gain.exponentialRampToValueAtTime(.001,t+c.d);
 if(c.lp){const l=AC.createBiquadFilter();l.frequency.setValueAtTime(c.lp,t);if(c.lpe)l.frequency.exponentialRampToValueAtTime(c.lpe,t+c.d);g.connect(l);l.connect(AC.destination)}else g.connect(AC.destination);
 [[1,1],...(c.h||[])].forEach(([m,a])=>{const o=AC.createOscillator(),h=AC.createGain();o.type=c.t;o.frequency.value=f0*m;if(c.det)o.detune.value=(Math.random()-.5)*c.det*2;h.gain.value=a;o.connect(h);h.connect(g);
  if(c.vib){const L=AC.createOscillator(),lg=AC.createGain();L.frequency.value=c.vib;lg.gain.value=f0*m*.012;L.connect(lg);lg.connect(o.frequency);L.start(t);L.stop(t+c.d)}o.start(t);o.stop(t+c.d)})}
function drum(k){const t=AC.currentTime,sw=(f1,f2,d,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)},

function row(L,name,sub,label,fn){const d=document.createElement('div');d.style.cssText='display:flex;align-items:center;justify-content:space-between;width:290px;gap:10px;font-size:18px;font-weight:800';const t=document.createElement('span');t.textContent=name+' · '+sub;const b=document.createElement('button');b.textContent=label;b.onclick=fn;d.append(t,b);L.appendChild(d)}

 try{list=(await(await fetch(PU+'index.json',{cache:'no-store'})).json()).patterns}catch(e){list=Object.entries(pats).filter(([f])=>!f.startsWith('my:')).map(([f,q])=>({name:q.name,file:f,mood:'offline'}))}

let mkT=0,mkD={melody:[],bass:[],drums:[]},mkTm;const TN=['melody','bass','drums'],DN=['🥁 Kick','🎩 Hat','🪘 Snare','🔔 Tom'];

[0,1,2].forEach(i=>$('t'+i).onclick=()=>{mkT=i;mkUI()});
$('mu').onclick=()=>{mkD[TN[mkT]].pop();mkUI()};$('mc').onclick=()=>{mkD[TN[mkT]]=[];mkUI()};
$('mp').onclick=()=>{ac();clearInterval(mkTm);let i=0;const n=Math.max(mkD.melody.length,mkD.bass.length,mkD.drums.length);mkTm=setInterval(()=>{if(i>=n){clearInterval(mkTm);return}TN.forEach((k,t)=>{const a=mkD[k];if(a.length)mkPlay(t,a[i%a.length])});i++},300)};
function mkObj(){const p={name:$('nm').value.trim()||'My pattern',mood:'mine',tempo:100,melody:mkD.melody.slice()};if(mkD.bass.length)p.bass=mkD.bass.slice();if(mkD.drums.length)p.drums=mkD.drums.slice();return p}
$('ma').onclick=()=>{if(!mkD.melody.length){$('mm').textContent='Add some melody notes first 🎵';return}const k='my:'+Date.now();pats[k]=mkObj();localStorage.setItem('ae_pats',JSON.stringify(pats));cfg.pat=k;ps=0;sv();$('mm').textContent='Saved & selected ✓'};
$('mj').onclick=()=>{const t=JSON.stringify(mkObj());try{navigator.clipboard.writeText(t).then(()=>$('mm').textContent='Copied ✓',()=>$('mm').textContent=t)}catch(e){$('mm').textContent=t}};
$('mkb').onclick=()=>{mkD={melody:[],bass:[],drums:[]};mkT=0;$('nm').value='';$('mm').textContent='';mkUI();$('mk').style.display='flex'};
$('mx').onclick=()=>{clearInterval(mkTm);$('mk').style.display='none'};
$('b6').onclick=openStore;$('sx').onclick=()=>{$('store').style.display='none';sui()};
const bonk=()=>ping(110,.4,.25,'sine'),chord=()=>[261.63,329.63,392,523.25].forEach((f,i)=>setTimeout(()=>ping(f,.2,1.2),i*90));
const sv=()=>localStorage.setItem('ae_cfg',JSON.stringify(cfg));
function sui(){$('b6').textContent='🎼 Pattern: '+(pats[cfg.pat]?pats[cfg.pat].name:'Off');$('b4').textContent='Instrument: '+INS[cfg.ins][0];$('b1').textContent='Sound: '+(cfg.snd?'ON':'OFF');$('b2').textContent='Notes: '+(cfg.mode=='up'?'Going UP ↗':'RANDOM 🎲')}
$('gear').onclick=()=>{sui();$('set').style.display='flex'};
$('b1').onclick=()=>{cfg.snd^=1;sv();sui();ac();tone()};
$('b2').onclick=()=>{cfg.mode=cfg.mode=='up'?'rnd':'up';sv();sui();ac();ni=0;lt=0;tone()};
$('b3').onclick=()=>$('set').style.display='none';
$('b4').onclick=()=>{cfg.ins=(cfg.ins+1)%INS.length;sv();sui();ac();ni=0;lt=0;tone()};
function showMenu(){$('play').textContent='▶ PLAY  (Level '+lvl+')';$('menu').style.display='flex'}
$('b5').onclick=()=>{$('set').style.display='none';state='menu';showMenu()};
$('play').onclick=()=>{ac();$('menu').style.display='none';start()};
$('ms').onclick=()=>{sui();$('set').style.display='flex'};
$('rz').onclick=()=>{z=1;px=py=0};
$('mb').onclick=start;
$('hint').onclick=()=>{const f=sn.filter(s=>!s.st&&occ[head(s)[1]][head(s)[0]]===s&&!blocker(s));if(f.length)f[Math.random()*f.length|0].hi=1.6};
const eob=t=>{t=Math.min(1,Math.max(0,t));return 1+2.7*(t-1)**3+1.7*(t-1)**2};
function draw(dt){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#e4e9d9';ctx.fillRect(0,0,W,H);ctx.setTransform(DPR*z,0,0,DPR*z,DPR*px,DPR*py);
 if(cs>9){ctx.fillStyle='#cdd4c0';for(let y=0;y<=G;y++)for(let x=0;x<=G;x++)ctx.fillRect(ox+x*cs-.7,oy+y*cs-.7,1.4,1.4)}
 ctx.lineCap=ctx.lineJoin='round';
 for(const s of sn){if(s.st==2)continue;
  let P=s.p.map(([c,y])=>[ox+(c+.5)*cs,oy+(y+.5)*cs]);const d=s.d;
  if(P.length==1){const[x,y]=P[0];P=[[x-d[0]*.3*cs,y-d[1]*.3*cs],[x+d[0]*.3*cs,y+d[1]*.3*cs]]}
  let Lp=0;for(let i=0;i<P.length-1;i++)Lp+=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);
  if(s.st==1){s.v+=dt*cs*70;s.s+=s.v*dt;if(s.s>s.e+.4*cs){s.st=2;if(--left==0){state='won';chord();setTimeout(()=>{lvl++;localStorage.setItem('ae_level',lvl);start()},900)}hud();continue}
   const t=P[P.length-1];P.push([t[0]+d[0]*(W+H),t[1]+d[1]*(W+H)])}
  s.sh=Math.max(0,s.sh-dt*2.5);s.fl=Math.max(0,s.fl-dt*2.5);s.hi=Math.max(0,s.hi-dt);
  const sc=eob((T-s.dl)/.45),ox2=Math.sin(T*70)*cs*.15*s.sh*d[1],oy2=Math.sin(T*70)*cs*.15*s.sh*d[0];
  ctx.save();ctx.translate(ox2,oy2);ctx.globalAlpha=Math.min(1,sc);
  ctx.strokeStyle=s.fl?'#e0394b':s.hi?'#e8a100':'#2e3a2e';ctx.lineWidth=Math.max(1.6,cs*.13*(s.hi?1.6:1))*Math.min(1,sc);
  const a=s.s,b=s.s+Lp;ctx.beginPath();let acc=0,st=false,lx=0,ly=0;
  for(let i=0;i<P.length-1;i++){const[x1,y1]=P[i],[x2,y2]=P[i+1],l=Math.hypot(x2-x1,y2-y1),s0=Math.max(a,acc),s1=Math.min(b,acc+l);
   if(s1>s0){const t0=(s0-acc)/l,t1=(s1-acc)/l;if(!st){ctx.moveTo(x1+(x2-x1)*t0,y1+(y2-y1)*t0);st=true}else ctx.lineTo(x1+(x2-x1)*t0,y1+(y2-y1)*t0);lx=x1+(x2-x1)*t1;ly=y1+(y2-y1)*t1;ctx.lineTo(lx,ly)}acc+=l}
  const k=cs*.34;ctx.moveTo(lx-d[0]*k-d[1]*k*.7,ly-d[1]*k+d[0]*k*.7);ctx.lineTo(lx,ly);ctx.lineTo(lx-d[0]*k+d[1]*k*.7,ly-d[1]*k-d[0]*k*.7);
  ctx.stroke();ctx.restore()}
 ctx.globalAlpha=1;
 ctx.setTransform(DPR,0,0,DPR,0,0);if(boss&&T<2){ctx.globalAlpha=Math.min(1,2-T);ctx.fillStyle='#a8161e';ctx.font='900 40px system-ui';ctx.textAlign='center';ctx.fillText('☠ BOSS LEVEL ☠',W/2,oy-12);ctx.globalAlpha=1}
 if(state=='won'){ctx.fillStyle='#2e3a2e';ctx.font='900 36px system-ui';ctx.textAlign='center';ctx.fillText('Cleared! ✓',W/2,H-50)}
}
let last=0;function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;T+=dt;draw(dt);requestAnimationFrame(loop)}
start();state='menu';showMenu();requestAnimationFrame(loop);
</script></body></html>
